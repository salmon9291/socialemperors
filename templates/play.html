<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Meta -->
    <meta charset="utf-8"/>
    <!-- Title and Icon -->
    <title id="pageTitle">Social Empires - Jugando</title>
    <link rel="shortcut icon" href="/img/icon.gif"/>
    <link rel="icon" type="image/png" href="/img/icon.gif"/>
    <script src="/js/external_interface.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #669C2C;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* BARRA FLOTANTE (BOTÓN DE CERRAR SESIÓN) */
        .top-navbar {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 9999;
            display: flex;
            align-items: center;
        }

        .logout-btn {
            background-color: rgba(211, 47, 47, 0.9);
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background-color 0.3s, transform 0.1s;
            backdrop-filter: blur(4px);
        }

        .logout-btn:hover {
            background-color: #b71c1c;
            transform: scale(1.05);
        }

        /* CONTENEDOR FLASH PANTALLA COMPLETA SIN ESTIRAR */
        .flash-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #669C2C;
        }

        .game-box {
            aspect-ratio: 760 / 600;
            width: 100%;
            height: 100%;
            max-width: calc(100vh * (760 / 600));
            max-height: calc(100vw * (600 / 760));
            display: flex;
        }

        object, embed {
            width: 100% !important;
            height: 100% !important;
            border: none;
        }
    </style>
</head>
<body>

    <!-- BOTÓN CERRAR SESIÓN FLOTANTE -->
    <div class="top-navbar">
        <a href="/" class="logout-btn">Cerrar sesión</a>
    </div>

    <!-- EMBED FLASH JUEGO NATIVO -->
    <div class="flash-container">

            <object id="se" classid="clsid:D27CDB6E-AE6D-11cf-96B8-444553540000" width="100%" height="100%">
                <param name="movie" value="http://{{SERVERIP}}:{{PORT}}/default01.static.socialpointgames.com/static/socialempires/flash/SELoader.swf?swftoload=http://{{SERVERIP}}:{{PORT}}/default01.static.socialpointgames.com/static/socialempires/flash/{{GAMEVERSION}}" />

                <param name="quality" value="high" />

                <param name="scale" value="showall" />
                <param name="wmode" value="opaque" />

                    src="http://{{SERVERIP}}:{{PORT}}/default01.static.socialpointgames.com/static/socialempires/flash/SELoader.swf?swftoload=http://{{SERVERIP}}:{{PORT}}/default01.static.socialpointgames.com/static/socialempires/flash/{{GAMEVERSION}}"

                    &sex=m&brk=0

</body>
</html>
