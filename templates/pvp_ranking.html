<!DOCTYPE html>
<html lang="en">
<head>
	<!-- Meta -->
	<meta charset="utf-8" />
	<!-- Title and Icon -->
	<title id="pageTitle">Social Empires</title>
	<link rel="shortcut icon" href="/img/icon.gif" />
	<link rel="icon" type="image/png" href="/img/icon.gif" />
	<!-- CSS -->
	<link rel="stylesheet" href="/css/facebook.css" />

<style>
    /* Forzar modo oscuro absoluto y paleta Retro Point */
    body, html {
        background-color: #090d16 !important;
        color: #ffffff !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    }
    header, nav, .navbar, .top-bar {
        background-color: #0d1321 !important;
        border-bottom: 1px solid #1e293b !important;
    }
    h1, h2, h3, h4, h5, h6, p, span, label, div {
        color: #ffffff !important;
    }
    .text-muted, small, .subtitle {
        color: #94a3b8 !important;
    }
    /* Tarjetas y contenedores */
    .card, .panel, .box, .container, .modal-content {
        background-color: #111827 !important;
        border: 1px solid #1e293b !important;
    }
    /* Inputs, selects y áreas de texto oscuras */
    input[type='text'], input[type='email'], input[type='password'], select, textarea {
        background-color: #090d16 !important;
        color: #ffffff !important;
        border: 1px solid #1e293b !important;
    }
    input::placeholder, textarea::placeholder {
        color: #64748b !important;
    }
    input:focus, select:focus, textarea:focus {
        border-color: #ff2a4b !important;
        outline: none !important;
    }
    /* Botones principales en rojo carmesí */
    button, input[type='submit'], .btn, .btn-primary, .btn-warning {
        background-color: #ff2a4b !important;
        background-image: none !important;
        color: #ffffff !important;
        border: none !important;
        font-weight: 700 !important;
    }
    button:hover, input[type='submit']:hover, .btn:hover, .btn-primary:hover, .btn-warning:hover {
        background-color: #e01e3d !important;
    }
    a {
        color: #ff2a4b !important;
        text-decoration: none;
    }
    a:hover {
        text-decoration: underline;
    }
</style>

    }
    button:hover, input[type='submit']:hover, .btn:hover, .btn-primary:hover, .btn-warning:hover {
        background-color: #e01e3d !important;
    }
    /* Botón Cerrar sesión (específico) */
    #logout-button, a[href*="logout"] {
        background-color: #ff2a4b !important;
        color: #ffffff !important;
    }
    #logout-button:hover, a[href*="logout"]:hover {
        background-color: #e01e3d !important;
    }
    a {
        color: #ff2a4b !important;
        text-decoration: none;
    }
    a:hover {
        text-decoration: underline;
    }
    /* Forzar que el logotipo de Social Empires sea oscuro */
    img[src*="logo"], .logo-img {
        filter: brightness(0.7) contrast(1.2) !important;
    }
</style>


<style>
    /* 1. Fondo oscuro global de Retro Point */
    body, html {
        background-color: #090d16 !important;
        color: #ffffff !important;
        font-family: system-ui, -apple-system, sans-serif !important;
    }

    /* 2. Ocultar o adaptar el panel/fondo verde brillante original */
    .left-panel, .hero-section, div[class*="left"], div[class*="bg-"] {
        background-color: #090d16 !important;
    }

    /* 3. Panel de formulario en tono oscuro */
    .login-box, .form-container, .card, .panel, main, div[class*="right"], div[class*="form"] {
        background-color: #111827 !important;
        color: #ffffff !important;
    }

    /* 4. Textos legibles en blanco y gris suave */
    h1, h2, h3, h4, h5, h6, label, p, span, div, td, th {
        color: #ffffff !important;
    }
    .text-muted, small, p[style*="color"] {
        color: #94a3b8 !important;
    }

    /* 5. Inputs y Selects oscuros con texto blanco nítido */
    input[type='text'], input[type='email'], input[type='password'], select, textarea {
        background-color: #090d16 !important;
        color: #ffffff !important;
        border: 1px solid #1e293b !important;
        border-radius: 6px !important;
        padding: 10px !important;
    }
    input::placeholder {
        color: #64748b !important;
    }
    input:focus, select:focus {
        border-color: #ff2a4b !important;
        outline: none !important;
    }

    /* 6. Botones principales en rojo carmesí de Retro Point */
    button, input[type='submit'], .btn, .btn-primary, .btn-warning {
        background-color: #ff2a4b !important;
        background-image: none !important;
        color: #ffffff !important;
        border: none !important;
        border-radius: 6px !important;
        font-weight: 700 !important;
        box-shadow: none !important;
    }
    button:hover, input[type='submit']:hover, .btn:hover, .btn-primary:hover, .btn-warning:hover {
        background-color: #e01e3d !important;
    }

    /* 7. Enlaces */
    a {
        color: #ff2a4b !important;
    }
</style>

</head>
<body class="ego_wide canvas center_fixed_width_app fbx UIPage_LoggedOut liquid hideBanner Locale_en_US" style="position: absolute; left: 50%; transform: translate(-50%, 0); overflow: auto;">
	<center><img src="/img/logo.png" style="width: 200px;" /></center>
	<div class="mvl ptm uiInterstitial canvas_error_page uiInterstitialLarge uiBoxWhite">
		<!-- HEAD TITLE -->
		<div class="uiHeader uiHeaderBottomBorder mhl mts uiHeaderPage interstitialHeader">
			<div class="clearfix uiHeaderTop">
				<div>
					<img src="/img/sword.png" height="18px" style="margin-left: 5px;">
					<h2 class="uiHeaderTitle" aria-hidden="true" style="margin-left: 2px; display: inline-block;">
						PVP Ranking
					</h2>
				</div>
			</div>
		</div>
		<!-- CONTENT -->
		<div class="phl ptm uiInterstitialContent" style="overflow: auto; display: inblock;">
			<div style="margin-left:20px; font-size:13px;">
				<table>
					<thead>
						<tr>
							<th width="40">Rank</th>
							<th width="200">Player</th>
							<th width="60">Honor</th>
							<th width="70">Victories</th>
							<th width="60">Defeats</th>
						</tr>
					</thead>
					<tbody style="font-size:13px;">
						{% for p in player_rank %}
						<tr>
							<td>{{loop.index}}.</td>
							<td>{% if p.img %}<img src="{{p.img}}" width="28" height="28" style="vertical-align: middle;"> {% endif %}<span>{{p.name}}</span></td>
							<td>{{p.honor}}</td>
							<td>{{p.w}}</td>
							<td>{{p.l}}</td>
						</tr>
						{% endfor %}
					</tbody>
				</table>
			</div>
		</div>
	</div>
</body>
</html>
