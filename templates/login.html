<head>
    <!-- Meta -->
    <meta charset="utf-8"/>
    <!-- Title and Icon -->
    <title id="pageTitle">Social Empires - Login</title>
    <link rel="shortcut icon" href="/img/icon.gif"/>
    <link rel="icon" type="image/png" href="/img/icon.gif"/>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
        }
        
        .split-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* MITAD IZQUIERDA: IMAGEN GRANDE */
        .left-image {
            flex: 6;
            background-image: url('https://raw.githubusercontent.com/AcidCaos/socialemperors/nerroth-rewrite/assets/images_new/CESPED.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* MITAD DERECHA: FORMULARIO */
        .right-form {
            flex: 4;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            padding: 40px;
            box-sizing: border-box;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            z-index: 10;
            overflow-y: auto; /* Permite hacer scroll si el formulario es alto y evita que se corte */
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            margin: auto; /* Centra el contenido dinámicamente respetando el scroll */
            padding-top: 20px;
            padding-bottom: 20px;
        }

        .login-box img.logo {
            width: 200px;
            margin-bottom: 20px;
            display: block;
        }

        .login-box .title-container {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .login-box .title-container img {
            margin-right: 8px;
            height: 20px;
        }

        .login-box h2 {
            color: #333;
            font-weight: 600;
            font-size: 24px;
            margin: 0;
        }

        .login-box p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
            margin-top: 5px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 13px;
            font-weight: 600;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #f8f9fa;
            transition: border-color 0.3s;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #1a73e8;
            background-color: #ffffff;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #1557b0;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }

        .register-link a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #d32f2f;
            background-color: #fdecea;
            padding: 10px;
            border-radius: 5px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #f5c2c7;
        }

        @media (max-width: 800px) {
            .split-container {
                flex-direction: column;
            }
            .left-image {
                flex: 3;
                min-height: 200px;
            }
            .right-form {
                flex: 7;
                padding: 20px;
            }
        }
    </style>

    background: none !important;

    <div class="split-container">
        <!-- MITAD IZQUIERDA: IMAGEN GRANDE -->
        <div class="left-image"></div>

        <!-- MITAD DERECHA: FORMULARIO -->
        <div class="right-form">
            <div class="login-box">
                <center><img src="/img/logo.png" alt="Social Empires Logo" class="logo"></center>
                
                <div class="title-container">
                    <img src="/img/sword.png" alt="Sword">
                    <h2>Bienvenido de nuevo</h2>
                </div>
                <p class="subtitle">
                    Inicia sesión para comandar tu imperio.<br>
                    <span style="font-size: 12px; color: #999;">By the Social Emperors team ~ {{ version | default("?") }}</span>
                </p>

                {% if error %}
                <div class="error-msg">{{ error }}</div>
                {% endif %}

                <form method="post" action="/">
                    <div class="input-group">
                        <label>Correo electrónico *</label>
                        <input type="email" name="email" placeholder="tu@correo.com" required>
                    </div>
                    
                    <div class="input-group">
                        <label>Contraseña *</label>
                        <input type="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div class="input-group">
                        <label>Flash Client</label>
                        <select id="RUNNER" name="RUNNER" required>
                            <option value="FLASH">Use Flash Player</option>
                            <option value="RUFFLE">Ruffle (Experimental)</option>
                        </select>
                    </div>

                    <div class="input-group">
