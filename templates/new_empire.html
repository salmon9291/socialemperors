<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Meta -->
    <meta charset="utf-8"/>
    <!-- Title and Icon -->
    <title id="pageTitle">Social Empires - Nuevo Imperio</title>
    <link rel="shortcut icon" href="/img/icon.gif"/>
    <link rel="icon" type="image/png" href="/img/icon.gif"/>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
        }
        
        .split-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* MITAD IZQUIERDA: IMAGEN GRANDE */
        .left-image {
            flex: 6;
            background-image: url('https://raw.githubusercontent.com/AcidCaos/socialemperors/nerroth-rewrite/assets/images_new/CESPED.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* MITAD DERECHA: FORMULARIO */
        .right-form {
            flex: 4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            padding: 40px;
            box-sizing: border-box;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            z-index: 10;
            overflow-y: auto; /* Permite hacer scroll si el formulario es muy largo */
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            margin: auto 0;
        }

        .login-box img.logo {
            width: 200px;
            margin-bottom: 20px;
            display: block;
        }

        .login-box h2 {
            color: #333;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 24px;
        }

        .login-box p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 13px;
            font-weight: 600;
        }

        .input-group input[type="text"], .input-group input[type="email"], .input-group input[type="password"], .input-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #f8f9fa;
            transition: border-color 0.3s;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #1a73e8;
            background-color: #ffffff;
        }

        .avatar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }

        #avatar_selection {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #1a73e8;
            margin-bottom: 10px;
            object-fit: cover;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #1557b0;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .register-link a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #d32f2f;
            background-color: #fdecea;
            padding: 10px;
            border-radius: 5px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #f5c2c7;
        }

        @media (max-width: 800px) {
            .split-container {
                flex-direction: column;
            }
            .left-image {
                flex: 3;
                min-height: 200px;
            }
            .right-form {
                flex: 7;
                padding: 20px;
            }
        }
    </style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5756611551910131" crossorigin="anonymous"></script>
</head>
<body>

    <div class="split-container">
        <!-- MITAD IZQUIERDA: IMAGEN GRANDE -->
        <div class="left-image"></div>

        <!-- MITAD DERECHA: FORMULARIO -->
        <div class="right-form">
            <div class="login-box">
                <img src="/img/logo.png" alt="Social Empires Logo" class="logo">
                
                <h2>Crea un Nuevo Imperio</h2>
                <p class="subtitle">
                    Funda tu aldea y prepárate para la batalla.<br>
                    <span style="font-size: 12px; color: #999;">By the Social Emperors team ~ {{ version | default("?") }}</span>
                </p>

                {% if error %}
                <div class="error-msg">{{ error }}</div>
                {% endif %}

                <form method="post" action="/reg/new">
                    
                    <div class="input-group">
                        <label>Correo electrónico *</label>
                        <input type="email" name="email" placeholder="tu@correo.com" required>
                    </div>
                    
                    <div class="input-group">
                        <label>Contraseña *</label>
                        <input type="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div class="input-group">
                        <label>Nombre del Jugador *</label>
                        <input type="text" id="playername" name="playername" placeholder="Emperador" minlength="3" maxlength="16" title="El nombre debe tener entre 3 y 16 caracteres, sin caracteres especiales." required/>
                    </div>

                    <div class="input-group avatar-container">
                        <img id="avatar_selection" src="/img/profile/default.jpg" alt="Avatar"/>
                        <div style="width: 100%;">
                            <label>Selecciona tu Avatar:</label>
                            <select id="AVATAR" name="AVATAR">
                                {% for a in avatars %}
                                <option value="{{a.url}}">{{a.name}}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Flash Client</label>
                        <select id="RUNNER" name="RUNNER" required>
                            <option value="FLASH">Use Flash Player</option>
                            <option value="RUFFLE">Ruffle (Experimental)</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Game version</label>
                        <select id="GAMEVERSION" name="GAMEVERSION" required>
                            <option value="SocialEmpires1.4.07sec_fixed.swf">1.4.07 (Latest)</option>
                            <option value="SocialEmpires0926bsec.swf">0.9.26b</option>
                        </select>
                    </div>

                    <button type="submit" class="submit-btn">Crear Imperio</button>
                </form>

                <div class="register-link">
                    ¿Ya tienes un imperio? <br><br>
                    <a href="/">Volver al inicio de sesión</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Script para el Avatar -->
    <script>
        // Previsualizar el avatar al cambiar la selección
        document.getElementById('AVATAR').addEventListener('change', function () {
            document.getElementById('avatar_selection').src = this.value == "" ? "/img/profile/default.jpg" : this.value;
        });

        // Avatar aleatorio al cargar la página
        document.addEventListener('DOMContentLoaded', function () {
            var options = document.getElementById('AVATAR').options;
            if (options.length > 0) {
                var n = Math.floor(Math.random() * options.length);
                document.getElementById('AVATAR').selectedIndex = n;
                document.getElementById('avatar_selection').src = options[n].value == "" ? "/img/profile/default.jpg" : options[n].value;
            }
        });
    </script>
</body>
</html>
