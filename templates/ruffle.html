<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta -->
    <meta charset="utf-8"/>
    <!-- Title and Icon -->
    <title id="pageTitle">Social Empires</title>
    <link rel="shortcut icon" href="/img/icon.gif"/>
    <link rel="icon" type="image/png" href="/img/icon.gif"/>
    <script src="/js/external_interface.js"></script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle/ruffle.js"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5756611551910131" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #669C2C;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Barra flotante únicamente para el botón de Logout */
        .top-navbar {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 9999;
            display: flex;
            align-items: center;
        }

        .logout-btn {
            background-color: rgba(211, 47, 47, 0.9);
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background-color 0.3s, transform 0.1s;
            backdrop-filter: blur(4px);
        }

        .logout-btn:hover {
            background-color: #b71c1c;
            transform: scale(1.05);
        }

        /* Contenedor principal centrado */
        .flash-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #669C2C;
        }

        /* Mantiene la proporción exacta 760x530 sin estirar */
        #ruffle {
            aspect-ratio: 760 / 530;
            width: 100%;
            height: 100%;
            max-width: calc(100vh * (760 / 530));
            max-height: calc(100vw * (530 / 760));
        }

        ruffle-embed, ruffle-player {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <!-- BOTÓN CERRAR SESIÓN FLOTANTE -->
    <div class="top-navbar">
        <a href="/" class="logout-btn">Logout</a>
    </div>

    <!-- EMBED GAME RUFFLE -->
    <div class="flash-container">
        <div id='ruffle'></div>
        <script>
            window.RufflePlayer = window.RufflePlayer || {};
            window.RufflePlayer.config = {
                letterbox: "on",
                scale: "showAll",
                forceScale: true,
                preferredRenderer: "canvas",
                wmode: "opaque"
            };

            var ruffle = window.RufflePlayer.newest(),
            player = Object.assign(document.getElementById("ruffle").appendChild(ruffle.createPlayer()), {
                width: "100%",
                height: "100%",
                style: 'width: 100%; height: 100%; background-color: #669C2C;',
            });
            player.load({ 
                url: "http://" + window.location.hostname + ":{{PORT}}/default01.static.socialpointgames.com/static/socialempires/flash/SELoader.swf?swftoload=http://" + window.location.hostname + ":{{PORT}}/default01.static.socialpointgames.com/static/socialempires/flash/{{GAMEVERSION}}",
                backgroundColor: "#669C2C",
                allowScriptAccess: false,
                autoplay: true,

                parameters: 'spdebug=notnull&brk=0' +
                    '&staticUrl=http://' + window.location.hostname + ':{{PORT}}/default01.static.socialpointgames.com/static/socialempires/&brk=0' +
                    '&dynamicUrl=http://' + window.location.hostname + ':{{PORT}}/dynamic.flash1.dev.socialpoint.es/appsfb/socialempiresdev/srvempires/&brk=0' +
                    '&skiphash12341=notnull&brk=0' +
                    '&fb_sig_user={{save_info.userid}}&brk=0' +
                    '&user_key=123456789&brk=0' +
                    '&language=en&brk=0' +
                    '&accessToken=AAABbZAm0wdMUBALsOrR0Ho68CLjaOT8SV3vftKg9mbo1zZColaW5FljRVaLxPGxXXnm1M98mTZCAttcQ4GHwvSyXfsyxYmvKMH8Hmn5iliSPnjvIsZA6&brk=0' +
                    '&sex=m&brk=0' +
                    '&lastLoggedIn={{save_info.last_logged_in}}&brk=0' +
                    '&dailyBonus=0&brk=0' +
                    '&friendsInfo={{friendsInfo | tojson}}&brk=0' +
                    '&serverTime={{serverTime}}&brk=0' +
                    '&forceSyncError=1&brk=0' +
                    '&forceAttackReload=0&brk=0' +
                    '&forceQuestReload=0&brk=0' +
                    '&mantenimiento=N&brk=0' +
                    '&fb_sig_friends=&brk=0' +
                    '&debugResources=1&brk=0' +
                    '&bookmarked=&brk=0' +
                    '&publishActions=1&brk=0' +
                    '&like=0&brk=0' +
                    '&lastInviteSend=0&brk=0' +
                    '&recentRequests=%7B%7D&brk=0' +
                    '&goldmember=0&brk=0' +
                    '&sp_ref_cat=unknown&brk=0' +
                    '&daysSinceRegistration=0&brk=0' +
                    '&push_time=30&brk=0' +
                    '&gamecrosspromo=DCI&brk=0' +
                    '&adVideo=0&brk=0' +
                    '&timeZone=0&brk=0' +
                    '&showInitialInvite=false&brk=0' +
                    '&game_status=3024-lev&brk=0' +
                    '{% if offers %}&offer_type=0&brk=0' +
                    '&offerBuildingTracking=false&brk=0' +
                    '&offerBuilding=false&brk=0' +
                    '{% endif %}&squirrel=0&brk=0' +
                    '&inviteTournament=0&brk=0' +
                    '&canvasaddress=http%3A%2F%2F' + window.location.hostname + '%3A{{PORT}}%2Fplay&brk=0'
            });
        </script>
    </div>
</body>
</html>
